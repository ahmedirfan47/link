<!-- Supabase → Authentication → Emails → Templates → Reset password. Subject: Reset your Link password -->
<div style="font-family: -apple-system, 'Segoe UI', Arial, sans-serif; max-width: 480px; margin: 0 auto; padding: 32px 24px; color: #191918;">
  <p style="font-size: 18px; font-weight: 700; margin: 0 0 24px;">Link</p>
  <p style="font-size: 15px; line-height: 1.5; margin: 0 0 20px;">Someone asked to reset the password for this Link account. Use the button to choose a new one.</p>
  <p style="margin: 0 0 24px;">
    <a href="{{ .ConfirmationURL }}" style="display: inline-block; background: #191918; color: #ffffff; text-decoration: none; font-size: 15px; font-weight: 600; padding: 10px 16px; border-radius: 5px;">Choose a new password</a>
  </p>
  <p style="font-size: 13px; line-height: 1.5; color: #6c6c67; margin: 0;">Open it in the same browser you asked from. If it was not you, ignore this email; your password stays the same.</p>
</div>
